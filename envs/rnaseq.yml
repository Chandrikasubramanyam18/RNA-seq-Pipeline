name: rnaseq-pipeline
channels:
  - conda-forge
  - bioconda
  - nodefaults
dependencies:
  # --- Core Runtimes & Languages ---
  - python=3.11
  - r-base>=4.5,<4.7
  - openjdk>=17

  # --- Workflow Engine ---
  - nextflow>=23.10.0

  # --- Quality Control & Read Preprocessing ---
  - fastqc=0.12.1
  - fastp=1.3.6
  - multiqc=1.35

  # --- Alignment, Indexing & BAM Operations ---
  - star=2.7.11b
  - samtools=1.24
  - subread=2.1.1        # provides featureCounts
  - rseqc=5.0.5

  # --- Transcript Quantification ---
  - salmon=2.7.0

  # --- Python Scientific Stack & Testing ---
  - pandas>=2.1.0
  - numpy>=1.26.0
  - scipy>=1.11.0
  - matplotlib>=3.8.0
  - seaborn>=0.13.0
  - biopython>=1.83
  - pytest>=8.0.0
  - rich>=13.7.0
  - pyyaml>=6.0.1

  # --- R Bioconductor & Statistical Packages ---
  - bioconductor-deseq2=1.50.2
  - bioconductor-clusterprofiler=4.18.4
  - bioconductor-org.hs.eg.db=3.22.0
  - bioconductor-org.mm.eg.db=3.22.0
  - bioconductor-tximport=1.38.2
  - bioconductor-genomicfeatures=1.62.0
  - bioconductor-rtracklayer=1.70.1
  - r-pheatmap=1.0.13
  - r-ggplot2=4.0.3
  - r-rcolorbrewer=1.1_3
  - r-optparse=1.8.2
  - r-cowplot=1.2.0
  - r-ggrepel=0.9.8
  - r-readr=2.2.0
  - r-dplyr=1.2.1
  - r-tibble=3.3.1
