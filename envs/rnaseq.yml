name: rnaseq-pipeline
channels:
  - conda-forge
  - bioconda
  - nodefaults
dependencies:
  # --- Core Runtimes & Languages ---
  - python=3.11
  - r-base=4.3.2
  - openjdk=17.0.8

  # --- Workflow Engine ---
  - nextflow>=23.10.0

  # --- Quality Control & Read Preprocessing ---
  - fastqc=0.12.1
  - fastp=0.23.4
  - multiqc=1.21

  # --- Alignment, Indexing & BAM Operations ---
  - star=2.7.11b
  - samtools=1.19.2
  - subread=2.0.6 # provides featureCounts
  - rseqc=5.0.3

  # --- Transcript Quantification ---
  - salmon=1.10.3

  # --- Python Scientific Stack & Testing ---
  - pandas>=2.1.0
  - numpy>=1.26.0
  - scipy>=1.11.0
  - matplotlib>=3.8.0
  - seaborn>=0.13.0
  - biopython>=1.83
  - pytest>=8.0.0
  - rich>=13.7.0
  - pyyaml>=6.0.1

  # --- R Bioconductor & Statistical Packages ---
  - bioconductor-deseq2=1.42.0
  - bioconductor-clusterprofiler=4.10.0
  - bioconductor-org.hs.eg.db=3.18.0
  - bioconductor-org.mm.eg.db=3.18.0
  - bioconductor-tximport=1.30.0
  - bioconductor-genomicfeatures=1.54.0
  - bioconductor-rtracklayer=1.62.0
  - r-pheatmap=1.0.12
  - r-ggplot2=3.4.4
  - r-rcolorbrewer=1.1_3
  - r-optparse=1.7.4
  - r-cowplot=1.1.3
  - r-ggrepel=0.9.5
  - r-readr=2.1.5
  - r-dplyr=1.1.4
  - r-tibble=3.2.1
